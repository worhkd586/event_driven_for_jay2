<title>이벤트 북</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: schedule-first desk — left sidebar (이벤트 일정 + one tab per category), main pane shows the agenda or one category milestone grid, slide-in detail sheet. Single dark look. */
:root {
  --bg: #0a0d12;
  --surface: #11161f;
  --sunken: #171d29;
  --line: #222a37;
  --fg: #e6e9f0;
  --muted: #8a93a6;
  --faint: #5c6576;
  --accent: #3db5e6;
  --accent-soft: rgba(61, 181, 230, 0.14);
  --pos: #3cc77f;
  --neg: #f0566a;
  --up: #ff5c6c;
  --down: #5e9dff;
  --warn: #e8b04a;
  /* 분류 색 (점·띠에만 사용) */
  --c-rights: #3db5e6; --c-bonus: #a28bff; --c-tender: #f2a65a; --c-split: #ec6fa9;
  --c-merge: #5fd3a6; --c-exchange: #e3cf5b; --c-transfer: #8fb6ff; --c-bw: #b9c0cf;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .dim { color: var(--muted); } .faint { color: var(--faint); }
.up { color: var(--up); } .down { color: var(--down); }

/* app shell: sidebar + main */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
  background: #0c1016; border-right: 1px solid var(--line); padding: 16px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.side .brand { margin: 0 0 14px; padding: 0 6px 14px; border-bottom: 1px solid var(--line); }
.side .brand > div > span { display: block; margin: 0; }
.nav-label { font-size: 11px; letter-spacing: 0.12em; color: var(--faint); font-weight: 600; padding: 12px 10px 4px; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; padding: 9px 10px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.nav-btn::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--cc, var(--muted)); flex: none; }
.nav-btn.cal::before { width: 14px; height: 14px; border-radius: 3px; background: none; border: 2px solid var(--accent); box-shadow: inset 0 3px 0 -1px var(--accent); }
.nav-btn span { flex: 1; min-width: 0; }
.nav-btn small { font-family: var(--font-mono); color: var(--muted); font-weight: 500; font-size: 12px; }
.nav-btn:hover { background: var(--sunken); }
.nav-btn[aria-current="page"] { background: var(--sunken); border-color: var(--cc, var(--accent)); }
.nav-btn.zero { opacity: 0.45; }
.side .sync { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); white-space: normal; }
.main { min-width: 0; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(10, 13, 18, 0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0 auto 0 0; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.top h1 small { font-size: 12px; font-weight: 400; color: var(--muted); }
.top .tools { margin-left: 0; }
.top-in, .page { max-width: 2400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, #2aa3d8, #1b6fb5); color: #fff; font-weight: 700; font-size: 13px; }
.brand b { font-size: 16px; }
.brand span { color: var(--muted); font-size: 12px; margin-left: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button small { font-family: var(--font-mono); font-weight: 500; margin-left: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok::before { background: var(--pos); } .sync.late::before { background: var(--warn); }

.page { padding-block: 18px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.page > * { min-width: 0; }
#grids { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.card { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 14px 16px 10px; }
.sec-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.sec-head p { margin: 0; font-size: 12px; color: var(--muted); }

/* latest feed (최신 이벤트 탭) */
.nav-btn.new::before { width: 10px; height: 10px; border-radius: 50%; background: var(--pos); box-shadow: 0 0 0 3px rgba(60, 199, 127, 0.18); }
.feed { display: grid; gap: 12px; }
.feed-day { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.feed-h { display: flex; align-items: baseline; gap: 10px; padding: 9px 14px; background: var(--sunken); border-bottom: 1px solid var(--line); }
.feed-h b { font-family: var(--font-mono); font-size: 15px; }
.feed-h span { font-size: 12px; color: var(--muted); }
.feed-h em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--muted); }
.feed-row { display: grid; grid-template-columns: 52px 4px minmax(110px, 0.9fr) 104px minmax(0, 2fr) 150px; gap: 12px; align-items: center; width: 100%; text-align: left;
  border: 0; border-top: 1px solid var(--line); background: transparent; padding: 9px 14px; cursor: pointer; font-size: 13px; }
.feed-row:first-of-type { border-top: 0; }
.feed-row:hover { background: var(--sunken); }
.feed-row .tm { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.feed-row i { align-self: stretch; border-radius: 2px; background: var(--cc, var(--muted)); }
.feed-row b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-row .cat { font-size: 12px; color: var(--muted); white-space: nowrap; }
.feed-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-row .tags { display: flex; gap: 4px; justify-content: flex-end; white-space: nowrap; }
.badge { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.badge.new { color: var(--pos); border-color: rgba(60, 199, 127, 0.5); }
.badge.amd { color: var(--warn); border-color: rgba(232, 176, 74, 0.45); }
.badge.cx, .corp .tg.cx { color: var(--neg); border-color: currentColor; }
.badge.ap { color: var(--accent); border-color: rgba(61, 181, 230, 0.45); }
.feed-tools { display: inline-flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.feed-tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
@media (max-width: 720px) {
  .feed-row { grid-template-columns: 4px minmax(0, 1fr) auto; grid-template-areas: "bar corp tags" "bar nm nm"; row-gap: 2px; }
  .feed-row i { grid-area: bar; } .feed-row b { grid-area: corp; } .feed-row .nm { grid-area: nm; font-size: 12px; color: var(--muted); } .feed-row .tags { grid-area: tags; }
  .feed-row .tm, .feed-row .cat { display: none; }
}

/* calendar (이벤트 일정 탭) */
.calnav { display: inline-flex; align-items: center; gap: 6px; }
.calnav button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.calnav button:hover { border-color: var(--muted); }
.calnav b { font-family: var(--font-mono); font-size: 14px; min-width: 150px; text-align: center; }
.cal { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.cal-hd, .cal-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) repeat(2, minmax(0, 0.6fr)); }
.cal-hd div { padding: 8px 10px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--sunken); }
.cal-hd div:nth-child(n+6) { color: var(--faint); }
.cal-cell { min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.cal-row > .cal-cell:nth-child(7n) { border-right: 0; }
.cal-row:last-child .cal-cell { border-bottom: 0; }
.cal.week .cal-cell { min-height: 420px; }
.cal.month .cal-cell { min-height: 118px; }
.cal-cell.out { background: rgba(0, 0, 0, 0.18); }
.cal-cell.out .cal-d { color: var(--faint); }
.cal-cell.wknd { background: rgba(0, 0, 0, 0.12); }
.cal-cell.today { box-shadow: inset 0 0 0 2px rgba(61, 181, 230, 0.6); }
.cal-d { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 12.5px; padding: 0 2px 2px; }
.cal-d b { font-weight: 600; }
.cal-cell.today .cal-d b { color: var(--accent); }
.cal-d small { color: var(--muted); font-size: 11px; }
.ev-chip { display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 0 6px; width: 100%; text-align: left; border: 0; background: var(--bg); border-radius: 5px; padding: 3px 6px 3px 0; cursor: pointer; line-height: 1.3; }
.ev-chip:hover { background: var(--sunken); }
.ev-chip i { grid-row: span 2; border-radius: 2px; background: var(--cc, var(--muted)); }
.ev-chip b { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-chip span { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-chip.est span::after { content: " ≈"; color: var(--warn); }
.ev-chip.past { opacity: 0.45; }
.cal.month .ev-chip { grid-template-columns: 3px minmax(0, 1fr); padding: 2px 5px 2px 0; }
.cal.month .ev-chip b { font-size: 11.5px; }
.cal.month .ev-chip span { display: inline; font-size: 11px; }
.cal.month .ev-chip.one { grid-template-rows: auto; }
.more-btn { border: 0; background: transparent; color: var(--accent); font-size: 11.5px; text-align: left; cursor: pointer; padding: 1px 4px; }
.cal-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.cal-key span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--cc); margin-right: 5px; }
@media (max-width: 720px) {
  .cal.week .cal-hd { display: none; }
  .cal.week .cal-row { grid-template-columns: minmax(0, 1fr); }
  .cal.week .cal-cell { min-height: 0; border-right: 0; }
  .cal.week .cal-cell .cal-d::before { content: attr(data-wd); color: var(--muted); }
  .cal.month .cal-hd, .cal.month .cal-row { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal.month .cal-cell { min-height: 58px; padding: 3px; }
  .cal.month .ev-chip { display: none; }
  .cal.month .more-btn { padding: 0; font-family: var(--font-mono); }
}

/* agenda list (unused) */
.range { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--surface); }
.range button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.range button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.agd { display: grid; gap: 12px; }
.agd-day { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.agd-day.today { border-color: rgba(61, 181, 230, 0.55); }
.agd-h { display: flex; align-items: baseline; gap: 10px; padding: 9px 14px; background: var(--sunken); border-bottom: 1px solid var(--line); }
.agd-h b { font-family: var(--font-mono); font-size: 15px; }
.agd-h span { font-size: 12px; color: var(--muted); }
.agd-day.today .agd-h span { color: var(--accent); font-weight: 600; }
.agd-h em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--muted); }
.agd-row { display: grid; grid-template-columns: 4px minmax(120px, 1.3fr) minmax(90px, 0.8fr) minmax(130px, 1.4fr) minmax(96px, auto) 92px; gap: 12px; align-items: center;
  width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 9px 14px; cursor: pointer; font-size: 13px; }
.agd-row:first-of-type { border-top: 0; }
.agd-row:hover { background: var(--sunken); }
.agd-row i { align-self: stretch; border-radius: 2px; background: var(--cc, var(--muted)); }
.agd-row b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agd-row .cat { color: var(--muted); font-size: 12px; white-space: nowrap; }
.agd-row .ms-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agd-row .ms-l em { font-style: normal; color: var(--warn); margin-left: 3px; }
.agd-row .mv { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
.agd-row .mv small { display: block; font-family: var(--font-body); font-size: 10.5px; color: var(--muted); }
.agd-row .px { text-align: right; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
@media (max-width: 720px) {
  .agd-row { grid-template-columns: 4px minmax(0, 1fr) auto; grid-template-areas: "bar corp mv" "bar ms mv"; row-gap: 2px; }
  .agd-row i { grid-area: bar; } .agd-row b { grid-area: corp; } .agd-row .ms-l { grid-area: ms; } .agd-row .mv { grid-area: mv; }
  .agd-row .cat, .agd-row .px { display: none; }
}

/* agenda strip (unused) */
.agenda { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(210px, 1fr); gap: 10px; overflow-x: auto; padding: 0 16px 16px; scroll-snap-type: x proximity; }
.day { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; scroll-snap-align: start; display: flex; flex-direction: column; }
.day.today { border-color: rgba(61, 181, 230, 0.6); box-shadow: inset 0 0 0 1px rgba(61, 181, 230, 0.25); }
.day-h { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 12px 7px; border-bottom: 1px solid var(--line); }
.day-h b { font-family: var(--font-mono); font-size: 15px; }
.day-h span { font-size: 12px; color: var(--muted); }
.day.today .day-h span { color: var(--accent); font-weight: 600; }
.day ul { list-style: none; margin: 0; padding: 6px; display: grid; gap: 4px; }
.ag { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 2px 9px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 7px; border-radius: 8px; cursor: pointer; }
.ag:hover { background: var(--sunken); }
.ag i { grid-row: span 2; align-self: stretch; border-radius: 2px; background: var(--cc, var(--muted)); }
.ag b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag small { grid-column: 2; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag em { grid-row: 1 / span 2; grid-column: 3; font-style: normal; font-family: var(--font-mono); font-size: 12px; }
.ag.est small::after { content: " ≈"; color: var(--warn); }
.day .none { padding: 14px 12px; font-size: 12px; color: var(--faint); }

/* filters */
.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 6px 11px; cursor: pointer; font-weight: 600; font-size: 13px; }
.tab::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--cc, var(--muted)); }
.tab[data-k="all"]::before { display: none; }
.tab small { font-family: var(--font-mono); color: var(--muted); font-weight: 500; }
.tab[aria-pressed="true"] { border-color: var(--cc, var(--accent)); background: var(--sunken); }
.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-left: auto; font-size: 13px; }
.tools input[type="search"] { width: 220px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tools input { accent-color: var(--accent); }

/* category grids */
.grid-card { border-left: 3px solid var(--cc, var(--line)); }
.grid-card .sec-head h2::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--cc); margin-right: 8px; transform: translateY(-1px); }
.twrap { overflow-x: auto; border-top: 1px solid var(--line); }
table.ms { width: 100%; border-collapse: collapse; font-size: 13px; }
.ms th { background: var(--surface); text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 9px 8px; white-space: nowrap; border-bottom: 1px solid var(--line); }
.ms th.r, .ms td.r { text-align: right; }
.ms th.d { border-left: 1px solid var(--line); text-align: center; }
.ms th.metric { color: var(--fg); }
.ms th.sortable { cursor: pointer; user-select: none; }
.ms th.sortable:hover { color: var(--fg); background: var(--bg); }
.ms th .sa { font-style: normal; font-size: 9px; margin-left: 4px; color: var(--faint); opacity: 0; }
.ms th.sortable:hover .sa, .ms th.on .sa { opacity: 1; }
.ms th.on { color: var(--accent); }
.ms th.on .sa { color: var(--accent); }
.ms td { padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.ms td.d { border-left: 1px solid var(--line); text-align: center; min-width: 66px; }
.ms tbody tr { cursor: pointer; }
.ms tbody tr:hover { background: var(--sunken); }
.ms tbody tr[aria-selected="true"] { background: var(--accent-soft); }
.ms tbody tr:last-child td { border-bottom: 0; }
.corp b { font-weight: 600; }
.corp small { display: block; font-size: 11px; color: var(--muted); }
.corp .tg { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
.corp .tg.ap { color: var(--accent); border-color: rgba(61, 181, 230, 0.45); }
.big { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
/* date cell */
.dc { display: grid; gap: 1px; justify-items: center; line-height: 1.25; }
.dc b { font-family: var(--font-mono); font-weight: 500; font-size: 13px; }
.dc small { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.dc.done b, .dc.done small { color: var(--faint); }
.dc.next b { color: var(--accent); font-weight: 600; }
.dc.next small { color: var(--accent); }
.dc.soon small { color: var(--warn); }
.dc.est b::after { content: "≈"; color: var(--warn); margin-left: 1px; font-size: 11px; }
.dc.none b { color: var(--faint); font-weight: 400; }
/* progress track */
.track { position: relative; width: 132px; height: 16px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--line); border-radius: 1px; }
.track .fill { position: absolute; left: 0; top: 7px; height: 2px; background: var(--cc, var(--accent)); border-radius: 1px; }
.track i { position: absolute; top: 4px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--bg); border: 2px solid var(--faint); }
.track i.done { background: var(--cc, var(--accent)); border-color: var(--cc, var(--accent)); }
.track .now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); border-radius: 1px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

            r.ms.map(function (m) { return '<td class="d">' + dateCell(m.v, t, r.nx && m.v && (m.v.d === r.nx.d || (m.v.e && m.v.d <= r.nx.d && m.v.e >= r.nx.d))) + "</td>"; }).join("") +
            '<td class="d">' + track(g, r.ms, t) + "</td></tr>";
        }).join("") + "</tbody></table></div></section>";
    });
    el.innerHTML = h || '<div class="card empty">조건에 맞는 이벤트가 없습니다.' + (state.view === "active" ? " 끝난 이벤트는 위쪽의 지난 이벤트에서 볼 수 있습니다." : "") + "</div>";
  }
  // 정렬값: 기업명, 지표 열(정렬 함수 또는 표시 글자), 일정 열(날짜), 진행(다음 일정)
  function sortVal(k, id) {
    if (id === "n") return function (r) { return r.g.n; };
    if (id === "p") return function (r) { return r.nx ? r.nx.d : null; };
    var i = +id.slice(1);
    if (id[0] === "d") return function (r) { var m = r.ms[i]; return m && m.v ? m.v.d : null; };
    var c = METRICS[k][i];
    return function (r) {
      if (c[3]) { var v = c[3](r.g); return v == null || !isFinite(v) ? null : v; }
      var t = String(c[1](r.g)).replace(/<[^>]+>/g, "").trim(); return t && t !== "—" ? t : null;
    };
  }
  function toggleSort(k, id, refocus) {   // 오름차순 → 내림차순 → 기본(다음 일정 순)
    var so = state.sort[k];
    if (!so || so.c !== id) state.sort[k] = { c: id, dir: id[0] === "m" && METRICS[k][+id.slice(1)][3] ? -1 : 1 };
    else if (so.dir === (id[0] === "m" && METRICS[k][+id.slice(1)][3] ? -1 : 1)) so.dir = -so.dir;
    else delete state.sort[k];
    renderGrid();
    var f = document.querySelector('th[data-k="' + k + '"][data-sort="' + id + '"]'); if (f && refocus) f.focus();
  }
  function renderCounts() {
    if (DATA.status !== "ok") return;
    var f = function (v) { var b = base(v); return state.tab === "agenda" ? b.length : b.filter(function (g) { return g.k === state.tab; }).length; };
    $("n-active").textContent = f("active"); $("n-past").textContent = f("past");
  }
  function renderSync() {
    var s = $("sync");
    if (DATA.status !== "ok") { s.className = "sync"; s.textContent = DATA.status === "loading" ? "불러오는 중" : "데이터 없음"; return; }
    var age = DATA.updated ? (Date.now() - new Date(DATA.updated).getTime()) / 60000 : 1e9;
    s.className = "sync " + (age < 120 ? "ok" : "late");
    s.textContent = "DART·시세 " + (DATA.updated ? DATA.updated.slice(5, 16).replace("T", " ").replace("-", "/") : "—") + (age < 120 ? "" : " · " + Math.round(age / 60) + "시간 전") +
      (DATA.source === "github" ? " · GitHub 직접" : "");
    s.title = DATA.source === "github" ? "GitHub 저장소의 data/view.json을 직접 읽었습니다 (5분마다 확인)" : "아티팩트 저장소(db)의 데이터입니다" + (DATA.gh && DATA.gh !== "ok" ? " · GitHub " + DATA.gh : "");
  }
  function renderAll() {
    renderCounts(); renderSync(); renderNav(); renderHeader();
    if (DATA.status !== "ok") { renderGrid(); return; }
    if (state.tab === "latest") renderLatest(); else if (state.tab === "agenda") renderAgenda(); else renderGrid();
  }

  // ---- 상세 시트 ----
  var lastFocus = null;
  function kv(rows) { return '<dl class="kv2">' + rows.map(function (x) { var long = String(x[1]).replace(/<[^>]+>/g, "").length > 44; return "<div" + (long ? ' class="full"' : "") + "><dt>" + x[0] + "</dt><dd>" + x[1] + "</dd></div>"; }).join("") + "</dl>"; }
  function renderDrawer(g) {
    var p = px(g), t = todayKey(), tl = timeline(g), nx = nextOf(g), mx = g.mx || {};
    $("d-title").textContent = g.n + " · " + NAMES[g.k];
    $("d-sub").textContent = g.nm + " · " + g.id;
    var hero = [];
    if (g.k === "rights") hero.push(["패리티", signed(parity(g)), "발행가 " + (issue(g) ? fmt(issue(g)) + " " + stage(g) : "없음")]);
    else if (g.k === "tender") hero.push(["공개매수가 괴리", signed(tenderGap(g)), "공개매수가 " + (mx.tender_price ? esc(mx.tender_price) : "확인 필요") + (mx.tender_alt ? ' <span style="color:var(--warn)">· 원문에 ' + esc(mx.tender_alt.join(", ")) + "원도 있음</span>" : "")]);
    else if (mx.appraisal_price) hero.push(["청구가 괴리", signed(apGap(g)), "매수청구가 " + fmt(N(mx.appraisal_price)) + (mx.appraisal_src ? " (원문)" : "") + (mx.appraisal_alt ? ' <span style="color:var(--warn)">· 원문에 ' + esc(mx.appraisal_alt.join(", ")) + "원도 있음</span>" : "")]);
    hero.push(["현재가", p ? fmt(p.price) : "—", p ? '<span class="' + (p.chg > 0 ? "up" : p.chg < 0 ? "down" : "") + '">' + (p.pct > 0 ? "+" : "") + Number(p.pct).toFixed(2) + "%</span> · 전일 " + fmt(p.prev) : (g.status === "past" ? "종료 이벤트" : "시세 없음")]);
    hero.push(["다음 일정", nx ? md(nx.d) : "—", nx ? esc(nx.label) + " · " + ddLabel(nx.d) : "남은 일정 없음"]);
    if (g.k === "rights") hero.push(["증서이론가", p && issue(g) ? fmt(p.price - issue(g)) : "—", "현재가 − 발행가"]);
    var h = '<div class="hero2">' + hero.map(function (x) { return "<div><span>" + x[0] + "</span><b>" + x[1] + "</b><small>" + x[2] + "</small></div>"; }).join("") + "</div>";
    h += '<div class="box"><h3>전체 일정<small>' + (g.status === "active" ? "진행 중 · 종료 기준 " + esc(g.end_basis) + " " + md(g.end) : "종료 · " + esc(g.end_basis)) + "</small></h3>" +
      (tl.length ? '<ul class="tl">' + tl.map(function (x) {
        var cls = x.d < t ? "done" : nx && x.d === nx.d && x.label === nx.label ? "next" : "";
        return '<li class="' + cls + '"><span class="num">' + x.d.replace(/-/g, ".") + " " + WD[dt(x.d).getUTCDay()] + "</span><span>" + esc(x.label) + (x.est ? " <em>추정</em>" : "") + '</span><span class="dd">' + (x.d < t ? "" : ddLabel(x.d)) + "</span></li>";
      }).join("") + "</ul>" : '<p class="dim" style="margin:0">공시에 일정 항목이 없습니다. 원문에서 확인하세요.</p>') + "</div>";
    var facts = [];
    if (g.k === "rights") {
      facts.push(["증자 방식", esc(mx.method || "—")], ["최초 신고서 발행가", mx.plan_price ? esc(mx.plan_price) : "—"],
        ["현재 발행가", issue(g) ? fmt(issue(g)) + (mx.price_final ? ' <span class="pos">확정</span>' : ' <span class="dim">미확정</span>') + (mx.price_doc ? ' · <a class="dim" href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=' + esc(mx.price_doc.r) + '" target="_blank" rel="noopener">' + esc(mx.price_doc.nm) + "</a>" : "") : "—"],
        ["조달 금액", N(mx.amount) ? fmt(Math.round(N(mx.amount) / 1e8)) + "억원" : "—"], ["신주 수", mx.count ? esc(mx.count) + "주" : "—"], ["주관사", esc((mx.underwriters || []).join(", ") || "—")]);
    }
    (g.detail || []).forEach(function (x) { facts.push([esc(x[0]), esc(x[1])]); });
    h += '<div class="box"><h3>상세 항목<small>DART 주요사항보고서</small></h3>' + (facts.length ? kv(facts) : '<p class="dim" style="margin:0">구조화된 상세 항목이 없는 공시입니다.</p>') + "</div>";
    var older = g.items.slice(1);
    h += '<div class="box"><h3>공시 이력<small>최신 1건' + (older.length ? " · 이전 " + older.length + "건" : "") + '</small></h3><ul class="hist">' +
      [g.items[0]].concat(state.histOpen ? older : []).map(function (e, i) { return '<li><span class="num dim">' + md(e.d) + '</span><a href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=' + esc(e.r) + '" target="_blank" rel="noopener">' + esc(e.nm) + (i === 0 ? " (최신)" : "") + "</a></li>"; }).join("") + "</ul>" +
      (older.length ? '<button type="button" class="btn-out" id="d-hist" style="margin-top:10px" aria-expanded="' + state.histOpen + '">' + (state.histOpen ? "이전 공시 접기" : "이전 공시 " + older.length + "건 보기") + "</button> " : "") +
      '<a class="btn-out" style="margin-top:10px" href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=' + esc(g.id) + '" target="_blank" rel="noopener">DART 원문</a></div>';
    $("d-body").innerHTML = h;
  }
  function openDrawer(id) {
    var g = DATA.groups.filter(function (x) { return x.id === id; })[0]; if (!g) return;
    state.sel = id; state.histOpen = false; lastFocus = document.activeElement;
    renderDrawer(g); $("d-body").scrollTop = 0;
    $("scrim").hidden = false; $("drawer").hidden = false; $("d-close").focus();
    Array.prototype.forEach.call(document.querySelectorAll(".ms tbody tr"), function (tr) { tr.setAttribute("aria-selected", tr.dataset.id === id); });
  }
  function closeDrawer() { if ($("drawer").hidden) return; $("drawer").hidden = true; $("scrim").hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }

  // ---- 데이터 (db 컬렉션 "view": meta + c-0..c-n) ----
  // 데이터는 두 곳에서 온다: GitHub 저장소의 data/view.json(수집기가 직접 올림)과 아티팩트 db. 더 최근 것을 쓴다.
  var GH_URL = "https://raw.githubusercontent.com/worhkd586/event_driven_for_jay2/refs/heads/claude/bold-mayer-mw3vwe/data/view.json";
  var GH_POLL_MS = 5 * 60e3;
  function setData(v, src) {
    if (!v || !v.groups) return;
    var t = function (x) { return x ? new Date(x).getTime() : 0; };
    // 다른 쪽이 더 최신이면 무시. 같은 시각이면 GitHub 쪽을 쓴다 (db는 같은 파일을 옮긴 것)
    if (DATA.status === "ok" && DATA.source !== src && (t(v.updated_at) < t(DATA.updated) || (src === "db" && t(v.updated_at) === t(DATA.updated)))) return;
    DATA.groups = v.groups; DATA.prices = v.prices || {}; DATA.updated = v.updated_at; DATA.eventsUpdated = v.events_updated_at; DATA.source = src;
    DATA.status = v.groups.length ? "ok" : "empty";
    renderAll();
    if (!$("drawer").hidden && state.sel) { var g = DATA.groups.filter(function (x) { return x.id === state.sel; })[0]; if (g) renderDrawer(g); }
  }
  function applyData(docs) {
    var meta = null, chunks = {};
    docs.forEach(function (d) { var v = d.data() || {}; if (d.id === "meta") meta = v; else if (/^c-\d+$/.test(d.id)) chunks[d.id] = v.groups || []; });
    if (!meta) { if (DATA.status !== "ok") { DATA.status = "empty"; renderAll(); } return; }
    var groups = [];
    for (var i = 0; i < (meta.chunks || 0); i++) { if (!chunks["c-" + i]) return; groups = groups.concat(chunks["c-" + i]); }   // 모든 조각이 올 때까지 기다린다
    setData({ groups: groups, prices: meta.prices, updated_at: meta.updated_at, events_updated_at: meta.events_updated_at }, "db");
  }
  function loadGitHub() {
    if (!window.fetch) return;
    fetch(GH_URL + "?t=" + Math.floor(Date.now() / GH_POLL_MS), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (v) { DATA.gh = "ok"; setData(v, "github"); renderSync(); },
        function (e) { DATA.gh = "실패: " + (e && e.message || e); renderSync(); });   // 막히거나 실패하면 db 데이터를 그대로 쓴다
  }
  function loadData() {
    var fail = function (s) { if (DATA.status !== "ok") { DATA.status = s; renderAll(); } };
    loadGitHub();
    setInterval(function () { if (!document.hidden) loadGitHub(); }, GH_POLL_MS);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) loadGitHub(); });
    if (!(window.claude && window.claude.use)) { setTimeout(function () { fail("nodb"); }, 4000); return; }
    Promise.resolve(window.claude.use("db")).then(function (db) {
      if (!db) { setTimeout(function () { fail("nodb"); }, 4000); return; }
      db.collection("view").onSnapshot(function (snap) { applyData(snap.docs); }, function () { fail("error"); });
    }, function () { setTimeout(function () { fail("nodb"); }, 4000); });
  }

  // ---- 바인딩 ----
  $("seg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-view]"); if (!b) return;
    state.view = b.dataset.view;
    Array.prototype.forEach.call(document.querySelectorAll("#seg button"), function (x) { x.setAttribute("aria-pressed", x === b); });
    renderAll();
  });
  $("lrange").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-ld]"); if (!b) return;
    state.ldays = +b.dataset.ld;
    Array.prototype.forEach.call(document.querySelectorAll("#lrange button"), function (x) { x.setAttribute("aria-pressed", x === b); });
    renderAll();
  });
  $("f-noamd").addEventListener("change", function () { state.noAmd = this.checked; renderAll(); });
  function setCal(mode) {
    state.cal = mode;
    Array.prototype.forEach.call(document.querySelectorAll("#range button"), function (x) { x.setAttribute("aria-pressed", x.dataset.cal === mode); });
    try { localStorage.setItem("eventbook.cal", mode); } catch (x) {}
  }
  $("range").addEventListener("click", function (e) { var b = e.target.closest("button[data-cal]"); if (!b) return; setCal(b.dataset.cal); renderAll(); });
  $("calnav").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-nav]"); if (!b) return;
    var n = +b.dataset.nav, a = state.anchor || todayKey();
    if (n === 0) state.anchor = null;
    else if (state.cal === "week") state.anchor = addDays(a, 7 * n);
    else { var m = new Date(Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1 + n, 1)); state.anchor = m.toISOString().slice(0, 10); }
    renderAll();
  });
  $("nav").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab;
    try { localStorage.setItem("eventbook.tab2", state.tab); } catch (x) {}
    renderAll(); window.scrollTo(0, 0);
  });
  $("q").addEventListener("input", function () { state.q = this.value.trim(); renderAll(); });
  $("f-3rd").addEventListener("change", function () { state.third = this.checked; renderAll(); });
  $("content").addEventListener("click", function (e) {
    var s = e.target.closest("th[data-sort]"); if (s) { toggleSort(s.dataset.k, s.dataset.sort); return; }
    var w = e.target.closest("[data-week]");   // 월별 보기에서 '+N건' → 그 주의 주별 보기
    if (w) { state.anchor = w.dataset.week; setCal("week"); renderAll(); return; }
    var r = e.target.closest("[data-id]"); if (r) openDrawer(r.dataset.id);
  });
  $("content").addEventListener("keydown", function (e) { if (e.key !== "Enter" && e.key !== " ") return;
    var s = e.target.closest("th[data-sort]"); if (s) { e.preventDefault(); toggleSort(s.dataset.k, s.dataset.sort, true); return; }
    var tr = e.target.closest("tr[data-id]"); if (tr) { e.preventDefault(); openDrawer(tr.dataset.id); } });
  $("scrim").addEventListener("click", closeDrawer);
  $("d-close").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
  $("d-body").addEventListener("click", function (e) {
    if (e.target.id !== "d-hist") return;
    state.histOpen = !state.histOpen;
    var g = DATA.groups.filter(function (x) { return x.id === state.sel; })[0];
    if (g) { var st = $("d-body").scrollTop; renderDrawer(g); $("d-body").scrollTop = st; }
  });

  try { var t0 = localStorage.getItem("eventbook.tab2"); if (t0 && (t0 === "agenda" || t0 === "latest" || NAMES[t0])) state.tab = t0; } catch (x) {}
  try { var c0 = localStorage.getItem("eventbook.cal"); if (c0 === "week" || c0 === "month") setCal(c0); } catch (x) {}
  renderAll();
  loadData();
})();
</script>
