<title>이벤트 북</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: schedule-first desk — top bar, 2-week agenda strip, category tabs, per-category milestone grid (dates as columns), slide-in detail sheet. Single dark look. */
:root {
  --bg: #0a0d12;
  --surface: #11161f;
  --sunken: #171d29;
  --line: #222a37;
  --fg: #e6e9f0;
  --muted: #8a93a6;
  --faint: #5c6576;
  --accent: #3db5e6;
  --accent-soft: rgba(61, 181, 230, 0.14);
  --pos: #3cc77f;
  --neg: #f0566a;
  --up: #ff5c6c;
  --down: #5e9dff;
  --warn: #e8b04a;
  /* 분류 색 (점·띠에만 사용) */
  --c-rights: #3db5e6; --c-bonus: #a28bff; --c-tender: #f2a65a; --c-split: #ec6fa9;
  --c-merge: #5fd3a6; --c-exchange: #e3cf5b; --c-transfer: #8fb6ff; --c-bw: #b9c0cf;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .dim { color: var(--muted); } .faint { color: var(--faint); }
.up { color: var(--up); } .down { color: var(--down); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(10, 13, 18, 0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in, .page { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, #2aa3d8, #1b6fb5); color: #fff; font-weight: 700; font-size: 13px; }
.brand b { font-size: 16px; }
.brand span { color: var(--muted); font-size: 12px; margin-left: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button small { font-family: var(--font-mono); font-weight: 500; margin-left: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok::before { background: var(--pos); } .sync.late::before { background: var(--warn); }

.page { padding-block: 18px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.page > * { min-width: 0; }
#grids { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.card { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 14px 16px 10px; }
.sec-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.sec-head p { margin: 0; font-size: 12px; color: var(--muted); }

/* agenda strip */
.agenda { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(210px, 1fr); gap: 10px; overflow-x: auto; padding: 0 16px 16px; scroll-snap-type: x proximity; }
.day { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); min-width: 0; scroll-snap-align: start; display: flex; flex-direction: column; }
.day.today { border-color: rgba(61, 181, 230, 0.6); box-shadow: inset 0 0 0 1px rgba(61, 181, 230, 0.25); }
.day-h { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 12px 7px; border-bottom: 1px solid var(--line); }
.day-h b { font-family: var(--font-mono); font-size: 15px; }
.day-h span { font-size: 12px; color: var(--muted); }
.day.today .day-h span { color: var(--accent); font-weight: 600; }
.day ul { list-style: none; margin: 0; padding: 6px; display: grid; gap: 4px; }
.ag { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 2px 9px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 7px; border-radius: 8px; cursor: pointer; }
.ag:hover { background: var(--sunken); }
.ag i { grid-row: span 2; align-self: stretch; border-radius: 2px; background: var(--cc, var(--muted)); }
.ag b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag small { grid-column: 2; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag em { grid-row: 1 / span 2; grid-column: 3; font-style: normal; font-family: var(--font-mono); font-size: 12px; }
.ag.est small::after { content: " ≈"; color: var(--warn); }
.day .none { padding: 14px 12px; font-size: 12px; color: var(--faint); }

/* filters */
.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 6px 11px; cursor: pointer; font-weight: 600; font-size: 13px; }
.tab::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--cc, var(--muted)); }
.tab[data-k="all"]::before { display: none; }
.tab small { font-family: var(--font-mono); color: var(--muted); font-weight: 500; }
.tab[aria-pressed="true"] { border-color: var(--cc, var(--accent)); background: var(--sunken); }
.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-left: auto; font-size: 13px; }
.tools input[type="search"] { width: 220px; max-width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tools input { accent-color: var(--accent); }

/* category grids */
.grid-card { border-left: 3px solid var(--cc, var(--line)); }
.grid-card .sec-head h2::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--cc); margin-right: 8px; transform: translateY(-1px); }
.twrap { overflow-x: auto; border-top: 1px solid var(--line); }
table.ms { width: 100%; border-collapse: collapse; font-size: 13px; }
.ms th { background: var(--surface); text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 9px 10px; white-space: nowrap; border-bottom: 1px solid var(--line); }
.ms th.r, .ms td.r { text-align: right; }
.ms th.d { border-left: 1px solid var(--line); text-align: center; }
.ms th.metric { color: var(--fg); }
.ms td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.ms td.d { border-left: 1px solid var(--line); text-align: center; min-width: 74px; }
.ms tbody tr { cursor: pointer; }
.ms tbody tr:hover { background: var(--sunken); }
.ms tbody tr[aria-selected="true"] { background: var(--accent-soft); }
.ms tbody tr:last-child td { border-bottom: 0; }
.corp b { font-weight: 600; }
.corp small { display: block; font-size: 11px; color: var(--muted); }
.corp .tg { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
.corp .tg.ap { color: var(--accent); border-color: rgba(61, 181, 230, 0.45); }
.big { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
/* date cell */
.dc { display: grid; gap: 1px; justify-items: center; line-height: 1.25; }
.dc b { font-family: var(--font-mono); font-weight: 500; font-size: 13px; }
.dc small { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.dc.done b, .dc.done small { color: var(--faint); }
.dc.next b { color: var(--accent); font-weight: 600; }
.dc.next small { color: var(--accent); }
.dc.soon small { color: var(--warn); }
.dc.est b::after { content: "≈"; color: var(--warn); margin-left: 1px; font-size: 11px; }
.dc.none b { color: var(--faint); font-weight: 400; }
/* progress track */
.track { position: relative; width: 132px; height: 16px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: var(--line); border-radius: 1px; }
.track .fill { position: absolute; left: 0; top: 7px; height: 2px; background: var(--cc, var(--accent)); border-radius: 1px; }
.track i { position: absolute; top: 4px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--bg); border: 2px solid var(--faint); }
.track i.done { background: var(--cc, var(--accent)); border-color: var(--cc, var(--accent)); }
.track .now { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); border-radius: 1px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); padding: 0 2px; }
.legend b { font-family: var(--font-mono); font-weight: 500; }
.legend .nx { color: var(--accent); } .legend .es { color: var(--warn); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 31; background: #0e131b; border-left: 1px solid var(--line);
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: -24px 0 60px rgba(0, 0, 0, 0.45); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .2s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } } }
.dhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 10px; border-bottom: 1px solid var(--line); }
.dhead h2 { margin: 0; font-size: 18px; }
.dhead p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.xbtn { border: 0; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.xbtn:hover { background: var(--sunken); }
.dbody { overflow-y: auto; padding: 16px 20px 28px; display: grid; gap: 14px; align-content: start; }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface); }
.box h3 { margin: 0 0 10px; font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.box h3 small { font-weight: 400; color: var(--muted); }
.hero2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hero2 div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); min-width: 0; }
.hero2 > div > span { display: block; font-size: 11.5px; color: var(--muted); }
.hero2 b { font-family: var(--font-mono); font-size: 19px; font-weight: 600; }
.hero2 > div > small { display: block; font-size: 11.5px; color: var(--muted); }
@media (max-width: 480px) { .hero2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 12px 116px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.tl li:last-child { border-bottom: 0; }
.tl li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--faint); transform: translateY(1px); }
.tl li.done { color: var(--faint); }
.tl li.done::before { background: var(--faint); }
.tl li.next { color: var(--fg); font-weight: 600; }
.tl li.next::before { border-color: var(--accent); background: var(--accent); }
.tl li em { font-style: normal; font-size: 11px; color: var(--warn); }
.tl li .dd { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tl li.next .dd { color: var(--accent); }
.kv2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
.kv2 > div { min-width: 0; }
.kv2 .full { grid-column: 1 / -1; }
.kv2 dt { font-size: 11.5px; color: var(--muted); }
.kv2 dd { margin: 2px 0 0; font-size: 13.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
.btn-out { display: inline-block; border: 1px solid var(--line); background: var(--sunken); border-radius: 9px; padding: 7px 13px; font-weight: 600; font-size: 13px; text-decoration: none; white-space: nowrap; cursor: pointer; }
.btn-out:hover { border-color: var(--muted); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12.5px; }
.hist li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }
.hist a { overflow-wrap: anywhere; }

@media (max-width: 720px) {
  .brand span { display: none; }
  .tools { margin-left: 0; width: 100%; }
  .tools input[type="search"] { width: 100%; }
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mark" aria-hidden="true">EB</span><b>이벤트 북</b><span>패리티 · 이벤트 일정</span></div>
    <div class="seg" role="group" aria-label="보기">
      <button type="button" data-view="active" aria-pressed="true">진행 중<small id="n-active">–</small></button>
      <button type="button" data-view="past" aria-pressed="false">지난 이벤트<small id="n-past">–</small></button>
    </div>
    <span class="sync" id="sync">불러오는 중</span>
  </div>
</header>

<main class="page">
  <section class="card" id="agenda-card" aria-labelledby="agenda-h">
    <div class="sec-head">
      <h2 id="agenda-h">다가오는 일정 · 2주</h2>
      <p>날짜별로 걸린 마일스톤입니다. 숫자는 유상증자 패리티, 매수청구 이벤트는 청구가 괴리입니다. ≈ 는 영업일로 계산한 추정일입니다.</p>
    </div>
    <div class="agenda" id="agenda"></div>
  </section>

  <section class="card">
    <div class="bar">
      <div class="tabs" id="tabs" role="group" aria-label="분류"></div>
      <div class="tools">
        <input type="search" id="q" placeholder="기업명·종목코드 검색" aria-label="기업 검색">
        <label for="f-3rd"><input type="checkbox" id="f-3rd"> 제3자배정 유상증자 포함</label>
        <label for="f-ap"><input type="checkbox" id="f-ap"> 매수청구권 있는 것만</label>
      </div>
    </div>
  </section>

  <div class="legend" aria-label="표 읽는 법">
    <span><b class="nx">10.24 · D-5</b> 다음 일정</span>
    <span><b class="es">≈</b> 영업일 기준 추정일 (공휴일 미반영)</span>
    <span><b class="faint">10.02</b> 지난 일정</span>
    <span>행 정렬: 다음 일정이 가까운 순 · 행을 누르면 전체 일정과 상세</span>
  </div>

  <div id="grids" aria-live="polite"></div>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <div class="dhead">
    <div><h2 id="d-title">이벤트 상세</h2><p id="d-sub"></p></div>
    <button type="button" class="xbtn" id="d-close" aria-label="닫기">×</button>
  </div>
  <div class="dbody" id="d-body"></div>
</aside>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (x, d) { return Number(x).toLocaleString("ko-KR", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var WD = ["일", "월", "화", "수", "목", "금", "토"];
  function todayKey() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
  function dt(s) { return new Date(s + "T00:00:00Z"); }
  function addDays(s, n) { var d = dt(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function bizBack(s, n) { var d = dt(s); while (n > 0) { d.setUTCDate(d.getUTCDate() - 1); var w = d.getUTCDay(); if (w !== 0 && w !== 6) n--; } return d.toISOString().slice(0, 10); }
  function dday(s) { return Math.round((dt(s) - dt(todayKey())) / 864e5); }
  function md(s) { return s ? s.slice(5).replace("-", ".") : "—"; }
  function ddLabel(s) { var n = dday(s); return n === 0 ? "오늘" : n > 0 ? "D-" + n : "D+" + (-n); }
  function N(v) { if (v == null || v === "") return null; var n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : null; }
  function trimNum(s) { return s.indexOf(".") >= 0 ? s.replace(/0+$/, "").replace(/\.$/, "") : s; }

  var NAMES = { rights: "유상증자", bonus: "무상증자", tender: "공개매수", split: "물적분할", merge: "인수합병", exchange: "주식교환·이전", transfer: "영업양수도", bw: "BW 발행(공모)" };
  var ORDER = ["rights", "merge", "exchange", "split", "transfer", "bonus", "tender", "bw"];
  var state = { view: "active", tab: "all", q: "", third: false, onlyAp: false, sel: null, histOpen: false };
  var DATA = { status: "loading", groups: [], prices: {}, updated: null, eventsUpdated: null };

  // ---- 일정 계산 ----
  function find(g, re) { for (var i = 0; i < g.sched.length; i++) if (re.test(g.sched[i][0])) return { d: g.sched[i][1], est: /추정/.test(g.sched[i][0]) }; return null; }
  function gm(g) { return find(g, /주총|주주총회/); }
  function apEnd(g) {   // 매수청구 마감: 공시에 있으면 그대로, 없으면 주총 + 20일 (상법)
    var x = find(g, /매수청구 종료/); if (x) return x;
    var m = gm(g); return g.ap === "Y" && m ? { d: addDays(m.d, 20), est: true } : null;
  }
  function exRight(g) { var b = find(g, /배정기준일/); return b ? { d: bizBack(b.d, 1), est: true } : null; }
  function priceFix(g) { var s = find(g, /청약 시작/); return s && !(g.mx && g.mx.price_final) ? { d: bizBack(s.d, 3), est: true } : null; }
  function subRange(g) { var s = find(g, /청약 시작/), e = find(g, /청약 종료/); return s ? { d: s.d, e: e && e.d } : null; }

  // 분류별 일정 열 [제목, 함수(g) -> {d, est, e?}]
  var MS = {
    rights: [["권리락", exRight], ["배정기준일", function (g) { return find(g, /배정기준일/); }], ["확정가 산정", function (g) { return priceFix(g) || (g.mx && g.mx.price_doc && g.mx.price_final ? { d: g.mx.price_doc.d } : null); }],

        return '<li class="' + cls + '"><span class="num">' + x.d.replace(/-/g, ".") + " " + WD[dt(x.d).getUTCDay()] + "</span><span>" + esc(x.label) + (x.est ? " <em>추정</em>" : "") + '</span><span class="dd">' + (x.d < t ? "" : ddLabel(x.d)) + "</span></li>";
      }).join("") + "</ul>" : '<p class="dim" style="margin:0">공시에 일정 항목이 없습니다. 원문에서 확인하세요.</p>') + "</div>";
    var facts = [];
    if (g.k === "rights") {
      facts.push(["증자 방식", esc(mx.method || "—")], ["최초 신고서 발행가", mx.plan_price ? esc(mx.plan_price) : "—"],
        ["현재 발행가", issue(g) ? fmt(issue(g)) + (mx.price_final ? ' <span class="pos">확정</span>' : ' <span class="dim">미확정</span>') + (mx.price_doc ? ' · <a class="dim" href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=' + esc(mx.price_doc.r) + '" target="_blank" rel="noopener">' + esc(mx.price_doc.nm) + "</a>" : "") : "—"],
        ["조달 금액", N(mx.amount) ? fmt(Math.round(N(mx.amount) / 1e8)) + "억원" : "—"], ["신주 수", mx.count ? esc(mx.count) + "주" : "—"], ["주관사", esc((mx.underwriters || []).join(", ") || "—")]);
    }
    (g.detail || []).forEach(function (x) { facts.push([esc(x[0]), esc(x[1])]); });
    h += '<div class="box"><h3>상세 항목<small>DART 주요사항보고서</small></h3>' + (facts.length ? kv(facts) : '<p class="dim" style="margin:0">구조화된 상세 항목이 없는 공시입니다.</p>') + "</div>";
    var older = g.items.slice(1);
    h += '<div class="box"><h3>공시 이력<small>최신 1건' + (older.length ? " · 이전 " + older.length + "건" : "") + '</small></h3><ul class="hist">' +
      [g.items[0]].concat(state.histOpen ? older : []).map(function (e, i) { return '<li><span class="num dim">' + md(e.d) + '</span><a href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=' + esc(e.r) + '" target="_blank" rel="noopener">' + esc(e.nm) + (i === 0 ? " (최신)" : "") + "</a></li>"; }).join("") + "</ul>" +
      (older.length ? '<button type="button" class="btn-out" id="d-hist" style="margin-top:10px" aria-expanded="' + state.histOpen + '">' + (state.histOpen ? "이전 공시 접기" : "이전 공시 " + older.length + "건 보기") + "</button> " : "") +
      '<a class="btn-out" style="margin-top:10px" href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=' + esc(g.id) + '" target="_blank" rel="noopener">DART 원문</a></div>';
    $("d-body").innerHTML = h;
  }
  function openDrawer(id) {
    var g = DATA.groups.filter(function (x) { return x.id === id; })[0]; if (!g) return;
    state.sel = id; state.histOpen = false; lastFocus = document.activeElement;
    renderDrawer(g); $("d-body").scrollTop = 0;
    $("scrim").hidden = false; $("drawer").hidden = false; $("d-close").focus();
    Array.prototype.forEach.call(document.querySelectorAll(".ms tbody tr"), function (tr) { tr.setAttribute("aria-selected", tr.dataset.id === id); });
  }
  function closeDrawer() { if ($("drawer").hidden) return; $("drawer").hidden = true; $("scrim").hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }

  // ---- 데이터 (db 컬렉션 "view": meta + c-0..c-n) ----
  function applyData(docs) {
    var meta = null, chunks = {};
    docs.forEach(function (d) { var v = d.data() || {}; if (d.id === "meta") meta = v; else if (/^c-\d+$/.test(d.id)) chunks[d.id] = v.groups || []; });
    if (!meta) { DATA.status = "empty"; renderAll(); return; }
    var groups = [];
    for (var i = 0; i < (meta.chunks || 0); i++) { if (!chunks["c-" + i]) return; groups = groups.concat(chunks["c-" + i]); }   // 모든 조각이 올 때까지 기다린다
    DATA.groups = groups; DATA.prices = meta.prices || {}; DATA.updated = meta.updated_at; DATA.eventsUpdated = meta.events_updated_at;
    DATA.status = groups.length ? "ok" : "empty";
    renderAll();
    if (!$("drawer").hidden && state.sel) { var g = DATA.groups.filter(function (x) { return x.id === state.sel; })[0]; if (g) renderDrawer(g); }
  }
  function loadData() {
    var fail = function (s) { DATA.status = s; renderAll(); };
    if (!(window.claude && window.claude.use)) { fail("nodb"); return; }
    Promise.resolve(window.claude.use("db")).then(function (db) {
      if (!db) { fail("nodb"); return; }
      db.collection("view").onSnapshot(function (snap) { applyData(snap.docs); }, function () { fail("error"); });
    }, function () { fail("nodb"); });
  }

  // ---- 바인딩 ----
  document.querySelector(".seg").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-view]"); if (!b) return;
    state.view = b.dataset.view;
    Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (x) { x.setAttribute("aria-pressed", x === b); });
    renderAll();
  });
  $("tabs").addEventListener("click", function (e) { var b = e.target.closest(".tab"); if (!b) return; state.tab = b.dataset.k; try { localStorage.setItem("eventbook.tab", state.tab); } catch (x) {} renderAll(); });
  $("q").addEventListener("input", function () { state.q = this.value.trim(); renderAll(); });
  $("f-3rd").addEventListener("change", function () { state.third = this.checked; renderAll(); });
  $("f-ap").addEventListener("change", function () { state.onlyAp = this.checked; renderAll(); });
  $("grids").addEventListener("click", function (e) { var tr = e.target.closest("tr[data-id]"); if (tr) openDrawer(tr.dataset.id); });
  $("grids").addEventListener("keydown", function (e) { if (e.key !== "Enter" && e.key !== " ") return; var tr = e.target.closest("tr[data-id]"); if (tr) { e.preventDefault(); openDrawer(tr.dataset.id); } });
  $("agenda").addEventListener("click", function (e) { var b = e.target.closest(".ag[data-id]"); if (b) openDrawer(b.dataset.id); });
  $("scrim").addEventListener("click", closeDrawer);
  $("d-close").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
  $("d-body").addEventListener("click", function (e) {
    if (e.target.id !== "d-hist") return;
    state.histOpen = !state.histOpen;
    var g = DATA.groups.filter(function (x) { return x.id === state.sel; })[0];
    if (g) { var st = $("d-body").scrollTop; renderDrawer(g); $("d-body").scrollTop = st; }
  });

  try { var t0 = localStorage.getItem("eventbook.tab"); if (t0 && (t0 === "all" || NAMES[t0])) state.tab = t0; } catch (x) {}
  renderAll();
  loadData();
})();
</script>
