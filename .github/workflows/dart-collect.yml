name: DART 이벤트 수집

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 밀리기도 해서, 평소 주기는 아래 next 작업이 이어 붙인다.
    # 이 예약은 이어 붙이기가 끊겼을 때 다시 시작시키는 용도 (KST 07~18시대, UTC 기준 표기)
    - cron: "*/20 22-23,0-9 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "조회 기간 (일). 과거 채우기는 90 (최대 90일, 알림 없음)"
        default: "1"

permissions:
  contents: write
  actions: write   # next 작업이 다음 실행을 건다

concurrency:
  group: dart-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '1' }}
        run: python collector/dart_collect.py

      - name: 대시보드 데이터 생성 (상세·일정·시세)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python collector/build_view.py

      - name: 변경 사항 커밋
        run: |
          git add data/dart_events.json data/view.json data/details.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "DART 이벤트 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

  # 다음 실행을 직접 건다. GitHub 예약 실행은 몇 시간씩 밀리거나 아예 안 돌 때가 있어 믿지 않는다.
  # 평일 07~19시(KST): 10분 쉬고 다음 실행. 그 밖의 시간: 다음 평일 07시까지 기다리되 한 번에 최대 5시간
  # (작업 제한 6시간) 쉬고 다음 실행을 걸어 사슬이 끊기지 않게 한다. 이미 대기 중인 실행이 있으면 건너뛴다.
  next:
    needs: collect
    if: always() && (github.event_name == 'schedule' || inputs.lookback_days == '1')   # 과거 채우기 실행은 잇지 않는다
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: 다음 실행 예약
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          wait=$(python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=9)))
          if now.weekday() < 5 and 7 <= now.hour < 19:
              print(600)
          else:
              t = now.replace(hour=7, minute=0, second=0, microsecond=0)
              if t <= now:
                  t += timedelta(days=1)
              while t.weekday() >= 5:
                  t += timedelta(days=1)
              print(max(60, min(int((t - now).total_seconds()), 5 * 3600)))
          PY
          )
          echo "다음 실행까지 ${wait}초 대기"
          sleep "$wait"
          waiting=$(gh run list --workflow dart-collect.yml --limit 20 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$waiting" -gt 0 ]; then echo "대기 중인 실행 $waiting건: 건너뜀"; exit 0; fi
          gh workflow run dart-collect.yml --ref "${GITHUB_REF_NAME}" -f lookback_days=1
          echo "다음 실행 예약됨"
