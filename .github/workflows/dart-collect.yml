name: DART 이벤트 수집

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (UTC 기준, GitHub 사정으로 몇 분 밀릴 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dart-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collector/dart_collect.py

      - name: 변경 사항 커밋
        run: |
          git add data/dart_events.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "DART 이벤트 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
